{% extends "base.html" %}

{% block content %}

<h2>Edit Category</h2>

<hr>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ category.name }}"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
class="form-control"
rows="4">{{ category.description }}</textarea>

</div>

<button
class="btn btn-warning">

Update Category

</button>

<a
href="{{ url_for('category.categories') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}

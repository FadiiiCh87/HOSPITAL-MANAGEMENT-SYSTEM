{% extends "base.html" %}

{% block content %}

<h2>Add Category</h2>

<hr>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
class="form-control"
rows="4"></textarea>

</div>

<button
class="btn btn-success">

Save Category

</button>

<a
href="{{ url_for('category.categories') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}

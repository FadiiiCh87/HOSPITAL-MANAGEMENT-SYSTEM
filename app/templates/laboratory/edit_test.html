{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                Edit Laboratory Test

            </h2>

            <p class="text-muted">

                Update laboratory test information.

            </p>

        </div>

        <a
            href="{{ url_for('laboratory.laboratory') }}"
            class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

    <div class="card shadow border-0">

        <div class="card-body">

            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Test Name

                        </label>

                        <input
                            type="text"
                            name="test_name"
                            value="{{ test.test_name }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Category

                        </label>

                        <select
                            name="category"
                            class="form-select"
                            required>

                            {% set categories = [
                                "Blood Test",
                                "Urine Test",
                                "X-Ray",
                                "Ultrasound",
                                "MRI",
                                "CT Scan",
                                "ECG",
                                "Other"
                            ] %}

                            {% for category in categories %}

                            <option
                                value="{{ category }}"
                                {% if test.category == category %}selected{% endif %}>

                                {{ category }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Price

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="price"
                            value="{{ test.price }}"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea
                        name="description"
                        rows="4"
                        class="form-control">{{ test.description }}</textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle-fill"></i>

                    Update Test

                </button>

                <a
                    href="{{ url_for('laboratory.laboratory') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

{% include 'includes/navbar.html' %}

<div class="container-fluid">

    <div class="row">

        {% include 'includes/sidebar.html' %}

        <main class="col main-content px-4 py-4">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}

                        <div class="alert alert-{{ category }}">

                            {{ message }}

                        </div>

                    {% endfor %}
                {% endif %}
            {% endwith %}



            
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            {% block content %}
 
            {% endblock %}

        </main>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
    const drawer = document.getElementById('staff-sidebar');
    const toggle = document.querySelector('[aria-controls="staff-sidebar"]');
    if (!drawer || !toggle || !window.bootstrap) return;
    toggle.setAttribute('aria-expanded', 'false');
    drawer.addEventListener('shown.bs.offcanvas', () => toggle.setAttribute('aria-expanded', 'true'));
    drawer.addEventListener('hidden.bs.offcanvas', () => toggle.setAttribute('aria-expanded', 'false'));
    // The desktop sidebar stays fixed, so explicitly release the mobile backdrop.
    window.matchMedia('(min-width: 992px)').addEventListener('change', event => {
        if (event.matches) bootstrap.Offcanvas.getInstance(drawer)?.hide();
    });
})();
</script>
</body>



</html>

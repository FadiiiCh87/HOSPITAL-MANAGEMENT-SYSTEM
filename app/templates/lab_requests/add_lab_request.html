{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                Add Laboratory Request

            </h2>

            <p class="text-muted">

                Create a new laboratory request.

            </p>

        </div>

        <a
            href="{{ url_for('lab_request.lab_requests') }}"
            class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

    <div class="card shadow border-0">

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Patient

                        </label>

                        <select
                            name="patient_id"
                            class="form-select"
                            required>

                            <option value="">

                                Select Patient

                            </option>

                            {% for patient in patients %}

                            <option value="{{ patient.id }}">

                                {{ patient.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Doctor

                        </label>

                        <select
                            name="doctor_id"
                            class="form-select"
                            required>

                            <option value="">

                                Select Doctor

                            </option>

                            {% for doctor in doctors %}

                            <option value="{{ doctor.id }}">

                                {{ doctor.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Laboratory Test

                        </label>

                        <select
                            name="laboratory_id"
                            class="form-select"
                            required>

                            <option value="">

                                Select Test

                            </option>

                            {% for test in tests %}

                            <option value="{{ test.id }}">

                                {{ test.test_name }}
                                ({{ test.category }})

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Request Date

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="Today's Date"
                            readonly>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Save Request

                </button>

                <a
                    href="{{ url_for('lab_request.lab_requests') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Edit User</h2>

        <a href="{{ url_for('user.users') }}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

    <hr>

    <div class="card shadow">

        <div class="card-body">

            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        value="{{ user.full_name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ user.email }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        New Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control">

                    <small class="text-muted">

                        Leave blank to keep the current password.

                    </small>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Role

                    </label>

                    <select
                        name="role"
                        class="form-select">

                        
                        <option value="Admin"
                            {% if user.role=="Admin" %}selected{% endif %}>
                            Admin
                        </option>

                        <option value="Receptionist"
                            {% if user.role=="Receptionist" %}selected{% endif %}>
                            Receptionist
                        </option>

                        <option value="Pharmacist"
                            {% if user.role=="Pharmacist" %}selected{% endif %}>
                            Pharmacist
                        </option>

                    <option value="Doctor" {% if user.role == "Doctor" %}selected{% endif %}>Doctor</option><option value="Lab Staff" {% if user.role == "Lab Staff" %}selected{% endif %}>Lab Staff</option><option value="Cashier" {% if user.role == "Cashier" %}selected{% endif %}>Cashier</option></select>
<label class="form-label mt-3" for="doctor_id">Linked doctor (required for Doctor role)</label>
<select class="form-select" name="doctor_id" id="doctor_id"><option value="">Select doctor</option>
{% for doctor in doctors %}<option value="{{ doctor.id }}" {% if doctor_link is defined and doctor_link and doctor_link.doctor_id == doctor.id %}selected{% endif %}>{{ doctor.full_name }}</option>{% endfor %}</select>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle-fill"></i>

                    Update User

                </button>

                <a href="{{ url_for('user.users') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

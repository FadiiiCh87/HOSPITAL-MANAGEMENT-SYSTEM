{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Edit User</h2>

        <a href="{{ url_for('user.users') }}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

    <hr>

    <div class="card shadow">

        <div class="card-body">

            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        value="{{ user.full_name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ user.email }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        New Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control">

                    <small class="text-muted">

                        Leave blank to keep the current password.

                    </small>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Role

                    </label>

                    <select
                        name="role"
                        class="form-select">

                        <option value="Admin"
                            {% if user.role=="Admin" %}selected{% endif %}>
                            Admin
                        </option>

                        <option value="Receptionist"
                            {% if user.role=="Receptionist" %}selected{% endif %}>
                            Receptionist
                        </option>

                        <option value="Pharmacist"
                            {% if user.role=="Pharmacist" %}selected{% endif %}>
                            Pharmacist
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle-fill"></i>

                    Update User

                </button>

                <a href="{{ url_for('user.users') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Add Patient</h2>

<hr>

<form method="POST">

<div class="row">

<div class="col-md-6">

<label>Full Name</label>

<input
type="text"
name="full_name"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Age</label>

<input
type="number"
name="age"
class="form-control"
required>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label>Gender</label>

<select
name="gender"
class="form-select">

<option value="Male">Male</option>
<option value="Female">Female</option>

</select>

</div>

<div class="col-md-6">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control">

</div>

</div>

<br>

<label>Email</label>

<input
type="email"
name="email"
class="form-control">

<br>

<div class="mb-3">
    <label class="form-label">Blood Group</label>

    <select name="blood_group" class="form-select">
        <option value="">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
    </select>
</div>

<label>Address</label>

<textarea
name="address"
class="form-control"
rows="3"></textarea>

<br>

<button class="btn btn-success">

Add Patient

</button>

<a
href="{{ url_for('patient.patients') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Edit Patient</h2>

<hr>

<form method="POST">

<div class="row">

    <div class="col-md-6">

        <label>Full Name</label>

        <input
        type="text"
        name="full_name"
        class="form-control"
        value="{{ patient.full_name }}"
        required>

    </div>

    <div class="col-md-6">

        <label>Age</label>

        <input
        type="number"
        name="age"
        class="form-control"
        value="{{ patient.age }}"
        required>

    </div>

</div>

<br>

<div class="row">

    <div class="col-md-6">

        <label>Gender</label>

        <select
        name="gender"
        class="form-select">

            <option value="Male"
            {% if patient.gender == "Male" %}selected{% endif %}>
            Male
            </option>

            <option value="Female"
            {% if patient.gender == "Female" %}selected{% endif %}>
            Female
            </option>

        </select>

    </div>

    <div class="col-md-6">

        <label>Phone</label>

        <input
        type="text"
        name="phone"
        class="form-control"
        value="{{ patient.phone }}">

    </div>

</div>

<br>

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{ patient.email }}">

<br>

<div class="mb-3">
    <label class="form-label">Blood Group</label>

    <select name="blood_group" class="form-select">

        <option value="">Select Blood Group</option>

        <option value="A+" {% if patient.blood_group=="A+" %}selected{% endif %}>A+</option>

        <option value="A-" {% if patient.blood_group=="A-" %}selected{% endif %}>A-</option>

        <option value="B+" {% if patient.blood_group=="B+" %}selected{% endif %}>B+</option>

        <option value="B-" {% if patient.blood_group=="B-" %}selected{% endif %}>B-</option>

        <option value="AB+" {% if patient.blood_group=="AB+" %}selected{% endif %}>AB+</option>

        <option value="AB-" {% if patient.blood_group=="AB-" %}selected{% endif %}>AB-</option>

        <option value="O+" {% if patient.blood_group=="O+" %}selected{% endif %}>O+</option>

        <option value="O-" {% if patient.blood_group=="O-" %}selected{% endif %}>O-</option>

    </select>
</div>

<label>Address</label>

<textarea
name="address"
class="form-control"
rows="3">{{ patient.address }}</textarea>

<br>

<button
class="btn btn-primary">

Update Patient

</button>

<a
href="{{ url_for('patient.patients') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}

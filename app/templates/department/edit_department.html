{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h4 class="mb-0">

                Edit Department

            </h4>

        </div>

        <div class="card-body">

            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label class="form-label">

                        Department Name

                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ department.name }}"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-warning">

                    Update

                </button>

                <a href="{{ url_for('department.departments') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Edit Medicine</h2>

<hr>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">Medicine Name</label>

        <input
        type="text"
        name="name"
        class="form-control"
        value="{{ medicine.name }}"
        required>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">Company</label>

        <input
        type="text"
        name="company"
        class="form-control"
        value="{{ medicine.company }}"
        required>

    </div>

</div>

<div class="mb-3">

<label class="form-label">

Category

</label>

<select
name="category_id"
class="form-select"
required>

{% for category in categories %}

<option
value="{{ category.id }}"

{% if medicine.category_id == category.id %}
selected
{% endif %}>

{{ category.name }}

</option>

{% endfor %}

</select>

</div>

<div class="row">

    <div class="col-md-4 mb-3">

        <label class="form-label">Price</label>

        <input
        type="number"
        step="0.01"
        name="price"
        class="form-control"
        value="{{ medicine.price }}"
        required>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">Stock Quantity</label>

        <input
        type="number"
        name="quantity"
        class="form-control"
        value="{{ medicine.quantity }}"
        required>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">Expiry Date</label>

        <input
        type="date"
        name="expiry_date"
        class="form-control"
        value="{{ medicine.expiry_date }}"
        required>

    </div>

</div>

<button class="btn btn-warning">

    Update Medicine

</button>

<a href="{{ url_for('medicine.medicines') }}"
class="btn btn-secondary">

    Cancel

</a>

</form>

{% endblock %}

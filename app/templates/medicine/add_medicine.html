{% extends "base.html" %}

{% block content %}

<h2>Add Medicine</h2>

<hr>

<form method="POST">

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">

            Medicine Name

        </label>

        <input
        type="text"
        name="name"
        class="form-control"
        required>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">

            Company

        </label>

        <input
        type="text"
        name="company"
        class="form-control"
        required>

    </div>

<div class="mb-3">

<label class="form-label">

Category

</label>

<select
name="category_id"
class="form-select"
required>

<option value="">

Select Category

</option>

{% for category in categories %}

<option value="{{ category.id }}">

{{ category.name }}

</option>

{% endfor %}

</select>

</div>


</div>

<div class="row">

    <div class="col-md-4 mb-3">

        <label class="form-label">

            Price

        </label>

        <input
        type="number"
        step="0.01"
        name="price"
        class="form-control"
        required>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">

            Stock Quantity

        </label>

        <input
        type="number"
        name="quantity"
        class="form-control"
        required>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">

            Expiry Date

        </label>

        <input
        type="date"
        name="expiry_date"
        class="form-control"
        required>

    </div>

</div>

<button class="btn btn-success">

    Save Medicine

</button>

<a href="{{ url_for('medicine.medicines') }}"
class="btn btn-secondary">

    Cancel

</a>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Create Bill</h2>

<hr>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">

        <label class="form-label">

            Patient

        </label>

        <select
            name="patient_id"
            class="form-select"
            required>

            <option value="">

                Select Patient

            </option>

            {% for patient in patients %}

            <option value="{{ patient.id }}">

                {{ patient.full_name }}

            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Consultation Fee

        </label>

        <input
            type="number"
            step="0.01"
            name="consultation_fee"
            class="form-control"
            value="0"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Medicine Charges

        </label>

        <input
            type="number"
            step="0.01"
            name="medicine_charge"
            class="form-control"
            value="0"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Other Charges

        </label>

        <input
            type="number"
            step="0.01"
            name="other_charge"
            class="form-control"
            value="0"
            required>

    </div>

    <button
        type="submit"
        class="btn btn-success">

        <i class="bi bi-check-circle"></i>

        Save Bill

    </button>

    <a
        href="{{ url_for('billing.bills') }}"
        class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Edit Bill</h2>

<hr>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">

            Patient

        </label>

        <select
            name="patient_id"
            class="form-select">

            {% for patient in patients %}

            <option
                value="{{ patient.id }}"
                {% if patient.id == bill.patient_id %}
                selected
                {% endif %}>

                {{ patient.full_name }}

            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label>Consultation Fee</label>

        <input
            type="number"
            step="0.01"
            name="consultation_fee"
            value="{{ bill.consultation_fee }}"
            class="form-control">

    </div>

    <div class="mb-3">

        <label>Medicine Charges</label>

        <input
            type="number"
            step="0.01"
            name="medicine_charge"
            value="{{ bill.medicine_charge }}"
            class="form-control">

    </div>

    <div class="mb-3">

        <label>Other Charges</label>

        <input
            type="number"
            step="0.01"
            name="other_charge"
            value="{{ bill.other_charge }}"
            class="form-control">

    </div>

    <div class="mb-3">

        <label>Payment Status</label>

        <select
            name="payment_status"
            class="form-select">

            <option
                value="Paid"
                {% if bill.payment_status=="Paid" %}
                selected
                {% endif %}>

                Paid

            </option>

            <option
                value="Unpaid"
                {% if bill.payment_status=="Unpaid" %}
                selected
                {% endif %}>

                Unpaid

            </option>

        </select>

    </div>

    <button
        class="btn btn-success">

        Update Bill

    </button>

    <a
        href="{{ url_for('billing.bills') }}"
        class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
